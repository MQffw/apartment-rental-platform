server:
  port: 8081

spring:
  # 读取仓库根目录的 .env.properties（真实密钥，已被 .gitignore 排除）。
  # 两条路径分别覆盖「工作目录=模块目录」（mvn spring-boot:run）与「工作目录=仓库根」（IDEA 直接运行）
  config:
    import:
      - optional:file:.env.properties
      - optional:file:../../.env.properties
  # 默认激活 dev；生产环境通过 SPRING_PROFILES_ACTIVE=prod 覆盖
  profiles:
    active: dev
  jackson:
    time-zone: GMT+8

springdoc:
  default-flat-param-object: true

# 邮箱验证码规则
verify:
  code:
    length: 6        # 验证码长度
    ttl: 300         # 有效期（秒）
    resend: 60       # 重发间隔（秒）
