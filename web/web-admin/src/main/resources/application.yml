server:
  port: 8080

spring:
  # 读取仓库根目录的 .env.properties（真实密钥，已被 .gitignore 排除）。
  # 两条路径分别覆盖「工作目录=模块目录」（mvn spring-boot:run）与「工作目录=仓库根」（IDEA 直接运行）
  config:
    import:
      - optional:file:.env.properties
      - optional:file:../../.env.properties
  # 默认激活 dev；生产环境通过 SPRING_PROFILES_ACTIVE=prod 覆盖
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

springdoc:
  default-flat-param-object: true

logging:
  level:
    # Spring Framework 6.0 对框架 jar（如 RabbitAdmin）解析参数名时的废弃降级警告，无功能影响，静音处理
    # 根治需升级 Spring Boot 3.2+（Spring Framework 6.1 已移除该降级逻辑）
    org.springframework.core.LocalVariableTableParameterNameDiscoverer: off
